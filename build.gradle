plugins {
	id "se.bjurr.gradle.bundle-command-shadow" version "2.1.2"
}

dependencies {
	api "se.bjurr.violations:violations-git-lib-transitives:2.5.9"
	api 'info.picocli:picocli:4.7.7'
	api "org.slf4j:slf4j-simple:2.0.19"
	api "tools.jackson.core:jackson-databind:3.2.2"
	compileOnly "com.github.spotbugs:spotbugs-annotations:4.10.4"
	testImplementation "org.junit.jupiter:junit-jupiter:6.1.3"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:6.1.3"
}

shadowJar {
	exclude 'META-INF/versions/21/**'
}

test {
	useJUnitPlatform()
}

shadowExtension {
	mainClass.set("se.bjurr.violations.main.Main")
	relocate.set("org:org,com:com")
}

staticCodeAnalysisExtension {
	maxViolations.set(0)
}

javaExtension {
	javaVersion = 17
}

if (System.getenv("CI")) {
	// A literal env var name containing a dot ("signing.password") does not
	// survive the GitHub Actions -> bash -> JVM chain, so use a dot-free name
	// in CI only. Local releases keep using "signing.password" via gradle.properties.
	signExtension {
		signingPasswordEnvOrProp.set("SIGNING_PASSWORD")
	}
}
