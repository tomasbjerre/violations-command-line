plugins {
	id "se.bjurr.gradle.bundle-command-shadow" version "1.4.0"
}

dependencies {
	api "se.bjurr.violations:violations-git-lib-transitives:2.5.3"
	api 'info.picocli:picocli:4.7.7'
	api 'org.slf4j:slf4j-simple:2.0.17'
	compileOnly 'com.github.spotbugs:spotbugs-annotations:4.9.6'
	testImplementation 'org.junit.jupiter:junit-jupiter:6.0.3'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

shadowJar {
	exclude 'META-INF/versions/21/**'
}

test {
	useJUnitPlatform()
}

shadowExtension {
	mainClass.set("se.bjurr.violations.main.Main")
	relocate.set("org:org,com:com")
}

staticCodeAnalysisExtension {
	maxViolations.set(0)
}

javaExtension {
	javaVersion = 17
}
